[package]
name = "gscrcpy"
version = "1.2.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
dirs = "7.0.0"
eframe = "0.36.2"
mdns-sd = "0.21"
qrcode = "0.14.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1"
