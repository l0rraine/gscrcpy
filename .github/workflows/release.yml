name: Release

# 推送 vx.x.x 样式的版本 tag 时触发（如 v1.0.0、v2.3.4）；
# 同时支持在 Actions 页面手动点击「Run workflow」运行（可填版本号命名 Release）
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.1）。留空则使用当前分支/ref 名'
        required: false
        default: ''

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust (stable / MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Package zip (exe + README)
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force package
          Copy-Item target/release/gscrcpy.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath "gscrcpy-$tag-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: |
            target/release/gscrcpy.exe
            gscrcpy-${{ steps.ver.outputs.version }}-windows-x64.zip
          generate_release_notes: true
